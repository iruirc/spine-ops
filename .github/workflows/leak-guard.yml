# Scan a public repo for what must not be public. Called from every public repo
# as <owner>/spine-ops/.github/workflows/leak-guard.yml@main, and run on spine-ops
# itself. The private stoplist arrives in the LEAK_STOPLIST secret, which
# leak-guard/sync-leak-secret.sh keeps current. Nothing here prints it.
name: leak-guard

on:
  workflow_call:
    secrets:
      LEAK_STOPLIST:
        required: false
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    # A push that deletes a branch or a tag has nothing to scan.
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Another repo calls this workflow: the scanner is spine-ops, next to the
      # checkout. It is untracked there, and --tree reads tracked files only.
      # A pull request to spine-ops itself is scanned by the scanner of its base
      # commit, so the pull request cannot change the rules it is judged by.
      - name: Check out spine-ops
        if: github.repository != format('{0}/spine-ops', github.repository_owner) || github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/spine-ops
          ref: ${{ github.repository == format('{0}/spine-ops', github.repository_owner) && github.event.pull_request.base.sha || '' }}
          path: .leak-guard-ops
          persist-credentials: false

      - name: Locate the scanner
        env:
          OWN_WORKING_COPY: ${{ github.repository == format('{0}/spine-ops', github.repository_owner) && github.event_name != 'pull_request' }}
        run: |
          if [ "$OWN_WORKING_COPY" = true ]; then
            echo "LEAK_GUARD_SCAN=leak-guard/scan.sh" >> "$GITHUB_ENV"
          else
            echo "LEAK_GUARD_SCAN=.leak-guard-ops/leak-guard/scan.sh" >> "$GITHUB_ENV"
          fi

      - name: Prepare the stoplist
        id: stoplist
        env:
          STOPLIST: ${{ secrets.LEAK_STOPLIST }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          set +x
          if [ -n "$STOPLIST" ]; then
            umask 077
            printf '%s\n' "$STOPLIST" > "$RUNNER_TEMP/stoplist"
            echo "LEAK_GUARD_STOPLIST=$RUNNER_TEMP/stoplist" >> "$GITHUB_ENV"
          elif [ "$IS_FORK_PR" = true ]; then
            echo "::warning::LEAK_STOPLIST unavailable to a fork pull request: only public patterns were checked"
            echo "LEAK_GUARD_PATTERNS_ONLY=1" >> "$GITHUB_ENV"
          else
            echo "::error::secret LEAK_STOPLIST is not set — run spine-ops/leak-guard/sync-leak-secret.sh"
            exit 1
          fi

      - name: Scan what this event brings
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +x
          if [ "$EVENT_NAME" = push ] && [[ "$AFTER" =~ ^0+$ ]]; then
            echo "a deleted ref: nothing to scan"
            exit 0
          fi
          args=(--redact)
          if [ "${LEAK_GUARD_PATTERNS_ONLY:-}" = 1 ]; then args+=(--patterns-only); fi
          case "$EVENT_NAME" in
            push)
              case "$REF" in
                refs/tags/*) mode=(--tag "${REF#refs/tags/}") ;;
                *)
                  if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                    mode=(--history)
                  else
                    mode=(--range "$BEFORE..$AFTER")
                  fi ;;
              esac ;;
            pull_request) mode=(--range "$BASE_SHA..$HEAD_SHA") ;;
            *) mode=(--history) ;;
          esac
          bash "$LEAK_GUARD_SCAN" "${args[@]}" "${mode[@]}"

      - name: Scan the tree as it is
        if: ${{ !cancelled() && steps.stoplist.outcome != 'failure' }}
        run: |
          set +x
          args=(--redact)
          if [ "${LEAK_GUARD_PATTERNS_ONLY:-}" = 1 ]; then args+=(--patterns-only); fi
          bash "$LEAK_GUARD_SCAN" "${args[@]}" --tree
